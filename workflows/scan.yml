name: Täglicher ZEIT-Scan

on:
  schedule:
    - cron: "15 4 * * *"   # täglich 04:15 UTC = 06:15 Uhr Sommerzeit / 05:15 Uhr Winterzeit
  workflow_dispatch:        # erlaubt einen Start per Knopfdruck

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: zeit.de scannen
        run: python scan.py
      - name: Ergebnis speichern
        run: |
          git config user.name "zeit-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Scan $(date +%d.%m.%Y)"
          git push
